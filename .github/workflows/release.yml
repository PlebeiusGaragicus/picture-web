name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14 # arm64
          - os: ubuntu-22.04 # x86_64; glibc 2.35 baseline
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r api/requirements.txt pyinstaller
      - name: Verify tag matches api/version.py
        run: |
          APP_VERSION="$(python -c "import sys; sys.path.insert(0,'api'); from version import APP_VERSION; print(APP_VERSION)")"
          [ "v$APP_VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != api/version.py v$APP_VERSION"; exit 1; }
      - name: Build release tarball (includes frozen smoke test)
        run: PYTHON=python scripts/build-release.sh
        env:
          # CI runners have no pi; the smoke test skips the pi gate.
          COMIC_CANVAS_SKIP_PI_CHECK: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.os }}
          path: dist-release/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: assets
        run: sha256sum *.tar.gz > checksums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.tar.gz
            assets/checksums.txt
          body: |
            ## comic-canvas ${{ github.ref_name }}

            Install or upgrade:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            > **⚠️ Pre-1.0 upgrade warning:** releases may change on-disk project
            > schemas without migration. Existing projects may stop loading after
            > an upgrade. Back up `~/.comic-canvas/projects` before upgrading, and
            > do not upgrade mid-project unless the release notes say it is safe.

            **Schema changes in this release:** _fill in (or "none")._

            Requires the [pi coding agent](https://github.com/badlogic/pi-mono) and
            Node 22+ on your system — comic-canvas drives your own pi models and
            credentials. Supported platforms: macOS arm64, Linux x86_64.
          draft: true
