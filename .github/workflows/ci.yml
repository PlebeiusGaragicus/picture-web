name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Run backend tests
        run: python -m pytest api/ -q
        env:
          COMIC_CANVAS_HOME: /tmp/cc-test-home

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web UI (tsc + vite)
        working-directory: webui
        run: |
          npm install --no-audit --no-fund
          npm run build

  shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck installer and scripts
        run: shellcheck install.sh scripts/*.sh run

  smoke:
    runs-on: ubuntu-22.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r api/requirements.txt
      - name: Build web UI
        working-directory: webui
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Unfrozen single-process smoke test
        run: PYTHON=python scripts/smoke-frozen.sh ./scripts/run-unfrozen.sh
